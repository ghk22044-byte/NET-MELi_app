  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #eef2f7; --surface: #ffffff; --text: #17202e; --muted: #64708a;
    --border: #dfe5ef; --accent: #0090d8; --on-accent: #ffffff;
    --mine: #0090d8; --theirs: #ffffff; --danger: #d64545;
    --mine-grad: linear-gradient(135deg,#00a8e8,#0072c6);
    --chat-bg: #e7edf5;
    --shadow: 0 10px 30px rgba(23,32,46,.14);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0e1420; --surface:#172033; --text:#e8edf7; --muted:#93a0ba; --border:#26314a;
      --accent:#3fb6f0; --on-accent:#0e1420; --mine:#2f7fc4; --theirs:#212c45; --danger:#ff7b7b;
      --mine-grad: linear-gradient(135deg,#3fb6f0,#2f6fc4); --chat-bg:#0b111c;
      --shadow:0 10px 30px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"] {
    --bg:#0e1420; --surface:#172033; --text:#e8edf7; --muted:#93a0ba; --border:#26314a;
    --accent:#3fb6f0; --on-accent:#0e1420; --mine:#2f7fc4; --theirs:#212c45; --danger:#ff7b7b;
    --mine-grad: linear-gradient(135deg,#3fb6f0,#2f6fc4); --chat-bg:#0b111c;
    --shadow:0 10px 30px rgba(0,0,0,.5);
  }
  *,*::before,*::after { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font-family:"Shabnam",Tahoma,"Segoe UI",system-ui,sans-serif; transition:background .3s,color .3s; }
  button, input { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* نوار بالا: دکمه سه‌نقطه همیشه بالا سمت راست */
  .topbar { display:flex; flex-direction:row-reverse; direction:ltr; align-items:center; justify-content:space-between;
    padding:14px 20px; position:sticky; top:env(safe-area-inset-top,0px); background:var(--bg); z-index:10; }
  html[dir="rtl"] .brand, html[dir="rtl"] .menu-wrap { direction:rtl; }
  html[dir="ltr"] .brand, html[dir="ltr"] .menu-wrap { direction:ltr; }
  .brand { font-weight:700; font-size:1.2rem; letter-spacing:.06em; display:flex; align-items:center; gap:10px; }
  html[dir="ltr"] .brand, html[dir="rtl"] .brand { direction:ltr; }
  .sticker { width:38px; height:38px; border-radius:10px; border:3px solid #fff; box-shadow:0 2px 8px rgba(0,0,0,.35), 0 0 0 1px rgba(0,0,0,.08);
    transform:rotate(-7deg); object-fit:cover; flex:none; }
  .menu-wrap { position:relative; }
  .dots-btn { width:42px; height:42px; border-radius:50%; border:1px solid var(--border);
    background:var(--surface); cursor:pointer; display:grid; place-items:center; }
  .dots-btn:hover { border-color:var(--accent); }
  .menu { position:absolute; top:50px; right:0; width:290px; max-width:calc(100vw - 32px);
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    box-shadow:var(--shadow); padding:16px; display:none; transform-origin:top right; }
  .menu.open { display:block; animation:pop .16s ease-out; }
  @keyframes pop { from{opacity:0;transform:scale(.94)} to{opacity:1;transform:none} }
  @media (prefers-reduced-motion: reduce) { .menu.open{animation:none} *{transition:none!important} }
  .profile { display:flex; align-items:center; gap:12px; padding-bottom:14px; border-bottom:1px solid var(--border); }
  .avatar { width:48px; height:48px; border-radius:50%; background:var(--mine-grad); color:var(--on-accent);

  .upload-bar .cancel { border:0; background:transparent; color:var(--danger); cursor:pointer; font-size:.8rem; padding:0 4px; }

  /* پروفایل و رنگ اکانت */
  .avatar img { width:100%; height:100%; object-fit:cover; display:block; }
  .avatar.has-color { box-shadow:0 0 0 2px var(--surface), 0 0 0 4px var(--c1); }
  .avatar.has-color.nophoto { background-image:var(--cg); color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.25); }
  .avatar.xl { width:84px; height:84px; font-size:2.2rem; border:4px solid var(--surface); box-shadow:none; }
  .cname { display:inline-block; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; vertical-align:bottom; }
  .cname.has-color { background-image:var(--cg); -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent; }
  .crown-badge { display:inline-block; margin-inline-start:3px; font-style:normal; filter:none; -webkit-text-fill-color:initial; }
  .admin-badge-img { display:inline-block; height:14px; width:auto; vertical-align:middle; margin-inline-start:4px; border-radius:3px; -webkit-text-fill-color:initial; }
  .pane-head.has-color { background-image:linear-gradient(90deg, color-mix(in srgb, var(--c1) 16%, transparent), color-mix(in srgb, var(--c2) 5%, transparent)); }
  .msgs.has-color .bubble.theirs { border-inline-start:3px solid var(--c1); }
  #chatAvatar, #chatName { cursor:pointer; }
  .link-btn.accent { color:var(--accent); margin-top:10px; }
  .link-btn.accent:hover { border-color:var(--accent); }

  .modal { position:fixed; inset:0; background:rgba(10,14,24,.55); display:grid; place-items:center; padding:16px; z-index:50; overflow-y:auto; }
  .sheet { width:100%; max-width:400px; max-height:calc(100dvh - 32px); overflow-y:auto; background:var(--surface); border:1px solid var(--border);
    border-radius:20px; box-shadow:var(--shadow); animation:pop .16s ease-out; }
  .cover { height:76px; position:relative; background-image:linear-gradient(135deg, var(--accent), var(--mine)); }
  .cover.has-color { background-image:var(--cg); }
  .x { position:absolute; top:10px; inset-inline-end:10px; width:34px; height:34px; border-radius:50%; border:0; cursor:pointer;
    background:rgba(0,0,0,.28); color:#fff; font-size:1.2rem; line-height:1; }
  .x:hover { background:rgba(0,0,0,.45); }
  .phead { position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; margin-top:-42px; padding:0 20px 4px; text-align:center; }
  .pname { font-weight:700; font-size:1.25rem; margin-top:6px; }
  .phandle { color:var(--muted); font-size:.85rem; direction:ltr; }
  .pbio { margin-top:8px; color:var(--text); font-size:.92rem; line-height:1.9; overflow-wrap:anywhere; }
  .pedit { padding:2px 20px 18px; }
  .prow { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:10px; }

  /* ---------- ویرایش پروفایل به سبک تلگرام ---------- */
  .modal.tg-edit-open { align-items:flex-start; padding:0; background:var(--bg); }
  .modal.tg-edit-open .sheet { max-width:520px; max-height:100dvh; height:100dvh; border-radius:0; border:0;
    box-shadow:none; display:flex; flex-direction:column; animation:none; }
  .tg-bar { display:flex; align-items:center; gap:14px; padding:14px 16px; padding-top:calc(14px + env(safe-area-inset-top,0px));
    background:var(--accent); color:var(--on-accent); flex:0 0 auto; position:relative; z-index:2; }
  .tg-bar .tg-x { position:static; width:auto; height:auto; background:transparent; color:var(--on-accent);
    font-size:1.3rem; padding:2px; }
  .tg-bar .tg-x:hover { background:rgba(255,255,255,.16); border-radius:50%; }
  .tg-bar-title { font-weight:700; font-size:1.05rem; flex:1; }
  .tg-check { border:0; background:transparent; color:var(--on-accent); cursor:pointer; width:38px; height:38px;
    border-radius:50%; display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
  .tg-check:hover { background:rgba(255,255,255,.16); }
  .tg-check svg { width:22px; height:22px; }
  .tg-edit-open .cover, .tg-edit-open .phead { display:none; }
  .tg-avatar-wrap { display:flex; flex-direction:column; align-items:center; gap:10px; padding:26px 20px 18px; flex:0 0 auto; }
  .tg-avatar-btn { position:relative; width:112px; height:112px; border-radius:50%; cursor:pointer; border:0; padding:0;
    background:var(--mine-grad); overflow:visible; }
  .tg-avatar-btn .avatar.xl { width:100%; height:100%; font-size:2.8rem; border:0; }
  .tg-avatar-cam { position:absolute; inset-inline-end:2px; bottom:2px; width:34px; height:34px; border-radius:50%;
    background:var(--accent); color:var(--on-accent); display:flex; align-items:center; justify-content:center;
    border:3px solid var(--surface); pointer-events:none; }
  .tg-avatar-cam svg { width:17px; height:17px; }
  .tg-avatar-hint { font-size:.82rem; color:var(--accent); font-weight:600; cursor:pointer; background:none; border:0; padding:2px 6px; }
  .tg-avatar-hint.danger { color:var(--danger); }
  .tg-fields { background:var(--surface); border-top:1px solid var(--border); border-bottom:1px solid var(--border); }
  .tg-field { position:relative; padding:18px 16px 8px; border-bottom:1px solid var(--border); }
  .tg-field:last-child { border-bottom:0; }
  .tg-field label { position:absolute; top:8px; inset-inline-start:16px; font-size:.72rem; color:var(--accent); font-weight:600; }
  .tg-field.has-value label { visibility:hidden; }
  .tg-field .field { border:0; background:transparent; padding:0; width:100%; font-size:1rem; color:var(--text); outline:0; }
  .tg-hint { padding:10px 16px 16px; font-size:.82rem; color:var(--muted); line-height:1.6; }
  .tg-section-label { padding:16px 16px 6px; font-size:.82rem; color:var(--muted); }
  .tg-edit-open .swatches, .tg-edit-open .stk-grid { padding:0 16px 16px; margin-top:0; }
  .tg-edit-open .hint.color_hint_tg { padding:0 16px 16px; }
  .tg-edit-open #pfStickerBtn, .tg-edit-open #pfOrLbl + .swatches { margin:0; }
  .tg-edit-open .actions, .tg-edit-open #pfCancel { display:none; }
  .tg-edit-open .msg { padding:0 16px; }
  .ghost { padding:8px 14px; border-radius:10px; border:1px solid var(--border); background:transparent; cursor:pointer; font-size:.88rem; }
  .ghost:hover { border-color:var(--accent); }
  .ghost.danger { color:var(--danger); }
  .ghost.danger:hover { border-color:var(--danger); }
  .sw.fl{width:46px;height:32px;border-radius:8px;border:1px solid var(--border)}
  .sw.fl.none{border:2px dashed var(--border)}
  .flag-badge{display:inline-block;width:46px;height:30px;border-radius:7px;border:1px solid var(--border);vertical-align:middle}
  .psticker{display:block;width:100px;max-width:60%;height:auto;aspect-ratio:387/93;object-fit:cover;border-radius:10px;margin:8px auto 0;border:1px solid var(--border)}
  .psticker[hidden],.stk-grid[hidden]{display:none}
  .stk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
  .stk{padding:0;border:2px solid transparent;border-radius:10px;overflow:hidden;cursor:pointer;background:var(--bg);max-width:100px;margin:0 auto}
  .stk img{display:block;width:100%;height:auto;border-radius:8px}
  .stk.on{border-color:var(--accent)}
  .stk.none{padding:14px 6px;border:2px dashed var(--border);color:var(--muted);grid-column:1/-1}
  .pk-in{height:1.15em;width:auto;vertical-align:-.22em;margin:0 1px}
  .pk-big{height:72px;width:auto;display:block}
  .pk-btn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:10px;padding:5px 12px;margin:6px 0 2px;cursor:pointer;font-size:.85rem}
  .pk-pop{position:fixed;left:50%;transform:translateX(-50%);bottom:70px;z-index:1000;width:min(94vw,400px);max-height:46vh;overflow:auto;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.3);padding:10px}
  .pk-pop[hidden]{display:none}
  .pk-head{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:8px}
  .pk-head button{border:0;background:transparent;color:var(--muted);font-size:1rem;cursor:pointer}
  .pk-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .pk-pick{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:6px;cursor:pointer;height:64px;display:flex;align-items:center;justify-content:center}
  .pk-pick img{max-width:100%;max-height:100%}
  .swatches { display:flex; flex-wrap:wrap; gap:10px; margin-top:4px; }
  .sw { width:34px; height:34px; border-radius:50%; border:2px solid transparent; cursor:pointer; padding:0; background-image:var(--cg); color:var(--muted); }
  .sw.none { background:var(--bg); border:2px dashed var(--border); }
  .sw[aria-checked="true"] { outline:2px solid var(--text); outline-offset:2px; }
  .actions { display:flex; gap:10px; margin-top:16px; }
  .actions .primary { margin-top:0; flex:1; }
  .actions .ghost { padding:0 18px; }


  /* اتصالات */
  :root { --good:#1f8a3b; --warn:#a86a00; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --good:#4cd07d; --warn:#f0b64a; } }
  :root[data-theme="dark"] { --good:#4cd07d; --warn:#f0b64a; }
  .page { max-width:640px; margin:0 auto; padding:0 20px 28px; }
  .page-head { display:flex; align-items:center; gap:12px; margin:4px 0 10px; }
  .page-head h1 { font-size:1.25rem; margin:0; }
  .pback { width:40px; height:40px; border-radius:10px; border:1px solid var(--border); background:var(--surface); cursor:pointer; display:grid; place-items:center; flex:none; font-size:1.1rem; }
  .pback:hover { border-color:var(--accent); }
  .page .lead { color:var(--muted); line-height:1.9; font-size:.92rem; margin:0 0 14px; }
  .opt { display:flex; align-items:center; gap:14px; width:100%; padding:14px 16px; background:var(--surface); border:1px solid var(--border); border-radius:16px; cursor:pointer; text-align:start; }
  .opt:hover { border-color:var(--accent); }
  .opt-ic { width:44px; height:44px; border-radius:12px; background:color-mix(in srgb, var(--accent) 14%, var(--surface)); color:var(--accent); display:grid; place-items:center; flex:none; }
  .opt-t { flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
  .opt-t small { color:var(--muted); line-height:1.8; }
  .chev { color:var(--muted); font-size:1.5rem; line-height:1; }
  .panel { background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:18px; margin-top:14px; }
  .panel h2 { font-size:1rem; margin:0 0 4px; }
  .panel .lead { margin:0; }
  .ip-form { display:flex; gap:10px; margin-top:12px; }
  .ip-form .field { flex:1; min-width:0; }
  #ipInput, .verdict .vip { font-family:ui-monospace, Menlo, Consolas, monospace; }
  .ip-form .primary { width:auto; margin-top:0; padding:0 22px; }
  .verdict { margin-top:14px; padding:14px 16px; border-radius:14px; border:1px solid var(--border); line-height:1.9; }
  .verdict b { display:block; font-size:1.05rem; }
  .verdict small { display:block; color:var(--muted); margin-top:4px; }
  .verdict .vip { direction:ltr; color:var(--muted); font-size:.82rem; text-align:start; }
  .verdict.good { border-color:var(--good); background:color-mix(in srgb, var(--good) 10%, var(--surface)); }
  .verdict.good b { color:var(--good); }
  .verdict.warn { border-color:var(--warn); background:color-mix(in srgb, var(--warn) 10%, var(--surface)); }
  .verdict.warn b { color:var(--warn); }
  .verdict.bad { border-color:var(--danger); background:color-mix(in srgb, var(--danger) 9%, var(--surface)); }
  .verdict.bad b { color:var(--danger); }
  .bar { height:8px; border-radius:99px; background:var(--bg); overflow:hidden; margin-top:14px; }
  .bar > div { height:100%; width:0; background:var(--accent); transition:width .2s; }
  .ip-list { margin-top:12px; border:1px solid var(--border); border-radius:12px; overflow:hidden; }
  .ip-row { display:flex; align-items:center; gap:10px; padding:9px 14px; border-bottom:1px solid var(--border); font-size:.9rem; }
  .ip-row:last-child { border-bottom:0; }
  .ip-row .ipv { direction:ltr; font-family:ui-monospace, Menlo, Consolas, monospace; }
  .ip-row .lb { color:var(--muted); font-size:.78rem; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; direction:ltr; text-align:start; }
  .st { font-size:.78rem; padding:2px 10px; border-radius:99px; border:1px solid var(--border); color:var(--muted); white-space:nowrap; }
  .st.good { color:var(--good); border-color:var(--good); }
  .st.warn { color:var(--warn); border-color:var(--warn); }
  .st.bad { color:var(--danger); border-color:var(--danger); }

  @media (max-width: 720px) {
    .app { grid-template-columns:1fr; }
    .app .pane { display:none; }
    .app.chat-open .side { display:none; }
    .app.chat-open .pane { display:flex; }
    .back { display:grid; place-items:center; }
  }

  /* ===== رفیقان، گروه، انتخاب آیدی ===== */
  .tabs { display:flex; gap:6px; padding:10px 14px 0; }
  .tab { flex:1; padding:9px 6px; border:0; border-radius:10px 10px 0 0; background:transparent; cursor:pointer;
         color:var(--muted); font-weight:600; border-bottom:2px solid transparent; }
  .tab[aria-selected="true"] { color:var(--accent); border-bottom-color:var(--accent); }
  .item-wrap { display:flex; align-items:center; }
  .item-wrap .item { flex:1; min-width:0; }
  .add-sq { flex:none; width:36px; height:36px; margin-inline:6px 14px; border-radius:10px; border:1.5px solid var(--accent);
            background:transparent; color:var(--accent); font-size:1.35rem; line-height:1; cursor:pointer; display:grid; place-items:center; padding:0; }
  .add-sq:hover { background:var(--accent); color:var(--on-accent); }
  .add-sq.done { border-color:var(--good); color:var(--good); background:color-mix(in srgb, var(--good) 14%, transparent); cursor:default; font-size:1rem; }
  .add-sq.done:hover { background:color-mix(in srgb, var(--good) 14%, transparent); color:var(--good); }
  .add-sq.rm { border-color:var(--danger); color:var(--danger); font-size:1rem; }
  .add-sq.rm:hover { background:var(--danger); color:#fff; }
  .add-sq:disabled { opacity:.5; }
  .friends-bar { display:flex; gap:8px; padding:8px 14px; border-bottom:1px solid var(--border); }
  .friends-bar .ghost { flex:1; }
  .chk { flex:none; width:22px; height:22px; margin-inline:14px 6px; border-radius:6px; border:2px solid var(--border); display:grid; place-items:center;
         font-size:.85rem; color:transparent; }
  .item.sel .chk, .sel-row.sel .chk { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
  .sel-row { display:flex; align-items:center; width:100%; border:0; background:transparent; cursor:pointer; padding:8px 0; text-align:start; gap:12px; }
  .sel-row:hover { background:var(--bg); }
  .sel-list { max-height:38vh; overflow-y:auto; border:1px solid var(--border); border-radius:12px; margin-top:8px; }
  .sheet .body { padding:20px; }
  .sheet .body h2 { margin:0 0 4px; font-size:1.1rem; }
  .sheet .body label { display:block; margin:14px 0 6px; font-size:.86rem; color:var(--muted); }
  .idpreview { direction:ltr; text-align:start; font-family:ui-monospace,Menlo,Consolas,monospace; margin-top:6px; }
  .avatar.grp { background:color-mix(in srgb, var(--accent) 18%, var(--surface)); color:var(--accent); }
  .bubble .who { font-size:.72rem; font-weight:700; margin-bottom:3px; color:var(--accent); display:flex; align-items:baseline; gap:6px; flex-wrap:wrap; max-width:100%; }
  .bubble .who .cname { max-width:60%; }
  .bubble .who .who-id { font-weight:400; opacity:.7; direction:ltr; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.68rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%; }
  .id-edit { display:flex; gap:8px; align-items:center; }
  .id-edit .field { direction:ltr; }
</style>
</head>

  function addRankBadge(el, rank) {
    if (rank === 'owner') {
      var s = document.createElement('span'); s.className = 'crown-badge'; s.textContent = '\u{1F451}'; s.title = 'Owner';
      el.appendChild(s);
    } else if (rank === 'admin') {
      var im = document.createElement('img'); im.className = 'admin-badge-img'; im.src = ADMIN_BADGE_SRC; im.alt = 'Admin'; im.title = 'Admin';
      el.appendChild(im);
    }
  }
  function sameList(a, b) { return JSON.stringify(a) === JSON.stringify(b); }
  function paintAvatar(el, p, name) {
    el.textContent = '';

    else el.textContent = initial(name);
    el.classList.toggle('nophoto', !(p && p.photo));
    applyColor(el, p && p.color);
  }
  function watchProfile(h) {
    if (!h || !db || profUnsubs[h]) return;
    profUnsubs[h] = db.doc('users/' + h).onSnapshot(function (snap) {
      if (snap.exists) {
        var d = snap.data(); d.handle = d.handle || h;
        profiles[h] = pickProf(d);
        if (me && h === me.handle) {
          me.name = profiles[h].name || me.name;
          var fl = Array.isArray(d.friends) ? d.friends : [];

        }
      }
      scheduleRefresh();
    }, function () {});
  }
  function stopProfiles() {
    Object.keys(profUnsubs).forEach(function (k) { try { profUnsubs[k](); } catch (e) {} });

  function scheduleRefresh() {
    if (refreshQueued) return; refreshQueued = true;
    requestAnimationFrame(function () { refreshQueued = false; refreshAll(); });

    if (!me) return;
    var p = profiles[me.handle] || pickProf(me);

  async function appendRaw(text) {
    if (db.canAppend) {                               /* سرور خودت: افزودنِ اتمیک، بدون خطر گم شدن پیام */

    var ref = db.doc('chats/' + curChatId());
    var snap = await ref.get();

      if (!snap.exists) throw new Error('gone');
      d = snap.data();
      var gnames = Object.assign({}, d.names || {}); gnames[me.handle] = me.name;
      var gm = (d.messages || []).concat([{ f: me.handle, x: text, t: Date.now() }]).slice(-10000);
      await ref.set({ members: d.members, title: d.title, owner: d.owner, names: gnames, messages: gm, updated: Date.now() });
    } else {
      d = snap.exists ? snap.data() : { members: [me.handle, activeOther], names: {}, messages: [] };
      var names = Object.assign({}, d.names || {});
      names[me.handle] = me.name; names[activeOther] = names[activeOther] || activeOtherName;
      var msgs = (d.messages || []).concat([{ f: me.handle, x: text, t: Date.now() }]).slice(-10000);

    }

  $('micBtn').addEventListener('click', async function () {
    if (!activeOther && !activeGroup) return;
    if (!(db && db.canUpload)) { flash(t('media_only_server')); return; }
    if (mediaRecorder && mediaRecorder.state === 'recording') { mediaRecorder.stop(); return; }
    if (!(navigator.mediaDevices && window.MediaRecorder)) { flash(t('mic_denied')); return; }
    try {
      recStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) { flash(t('mic_denied')); return; }
    recChunks = [];
    try { mediaRecorder = new MediaRecorder(recStream); }
    catch (e) { flash(t('mic_denied')); recStream.getTracks().forEach(function (tr) { tr.stop(); }); return; }
    mediaRecorder.addEventListener('dataavailable', function (e) { if (e.data && e.data.size) recChunks.push(e.data); });
    mediaRecorder.addEventListener('stop', function () {
      recStream.getTracks().forEach(function (tr) { tr.stop(); });
      setMicRecording(false);
      var blob = new Blob(recChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
      recChunks = [];
      if (blob.size > 300) uploadAndSend('voice', blob, 'voice.webm', blob.type);

    setMicRecording(true);

  function toAscii(s) {
    return s.replace(/[۰-۹]/g, function (d) { return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d); })
            .replace(/[٠-٩]/g, function (d) { return '٠١٢٣٤٥٦٧٨٩'.indexOf(d); });
  }
  function parseIp(raw) {
    var s = toAscii(String(raw || '')).trim().replace(/^https?:\/\//i, '').replace(/\/.*$/, '');
    var m4 = s.match(/^(\d{1,3}(?:\.\d{1,3}){3})(?::\d{1,5})?$/);
    if (m4) {
      var q = m4[1].split('.').map(Number);
      if (q.some(function (n) { return n > 255; })) return { err: 'err_ip_fmt' };
      var a = q[0], b = q[1];
      if (a === 0 || a === 10 || a === 127 || a >= 224 || (a === 169 && b === 254) || (a === 172 && b >= 16 && b <= 31) ||
          (a === 192 && b === 168) || (a === 100 && b >= 64 && b <= 127) || (a === 192 && b === 0 && q[2] === 0)) return { err: 'err_ip_private' };
      return { ip: q.join('.') };
    }
    var s6 = s.replace(/^\[|\]$/g, '').toLowerCase();
    if (s6.indexOf(':') >= 0 && /^[0-9a-f:]+$/.test(s6)) {
      try { new URL('https://[' + s6 + ']/'); } catch (e) { return { err: 'err_ip_fmt' }; }
      if (s6 === '::1' || s6 === '::' || /^f[cd]/.test(s6) || /^fe[89ab]/.test(s6)) return { err: 'err_ip_private' };
      return { ip: s6 };
    }
    return { err: 'err_ip_fmt' };
  }

  /* یک سنجش: اتصال HTTPS به آیپی. ok = پاسخ کامل، fail = سریع رد شد (آیپی زنده ولی گواهی نامعتبر)، timeout = بی‌پاسخ */
  function probe(ip, ms) {
    return new Promise(function (resolve) {
      var host = ip.indexOf(':') >= 0 ? '[' + ip + ']' : ip;
      var ctrl = new AbortController(), t0 = performance.now(), done = false;
      var timer = setTimeout(function () { ctrl.abort(); }, ms);
      function finish(st) {
        if (done) return; done = true; clearTimeout(timer);
        resolve({ state: st, ms: Math.round(performance.now() - t0) });
      }
      try {
        fetch('https://' + host + '/?_=' + Date.now(), { mode: 'no-cors', cache: 'no-store', credentials: 'omit', referrerPolicy: 'no-referrer', signal: ctrl.signal })
          .then(function () { finish('ok'); })
          .catch(function () { finish(ctrl.signal.aborted ? 'timeout' : 'fail'); });
      } catch (e) { finish('fail'); }
    });
  }

  function renderOwn() {
    var box = $('ownResult'); box.textContent = '';
    if (!ownState) return;
    var pr = ownState.probes;
    if (!ownState.done) { box.appendChild(el('div', 'msg', fmt('ip_running', { ip: ownState.ip, n: nf(pr.length + 1), m: nf(3) }))); return; }
    var resp = pr.filter(function (p) { return p.state !== 'timeout'; }), r = resp.length;
    var avg = r ? Math.round(resp.reduce(function (a, p) { return a + p.ms; }, 0) / r) : 0;
    var cls, title;
    if (r === 3) { if (avg > 1500) { cls = 'warn'; title = t('v_slow'); } else { cls = 'good'; title = t('v_good'); } }
    else if (r > 0) { cls = 'bad'; title = t('v_unstable'); }
    else { cls = 'bad'; title = t('v_bad'); }
    var v = el('div', 'verdict ' + cls);
    v.appendChild(el('b', null, title));
    v.appendChild(el('div', 'vip', ownState.ip));
    v.appendChild(el('div', null, fmt('d_all', { r: nf(r), n: nf(3) })));
    if (r) {
      v.appendChild(el('div', null, fmt('d_lat', { ms: nf(avg) })));
      v.appendChild(el('small', null, t(pr.some(function (p) { return p.state === 'ok'; }) ? 'd_tls_ok' : 'd_tls_no')));
    } else v.appendChild(el('small', null, t('d_none')));
    box.appendChild(v);
  }

  function renderPool() {
    var total = IP_POOL.length, res = poolState.results;
    var doneN = IP_POOL.filter(function (i) { return res[i.ip] && res[i.ip].state !== 'testing'; }).length;
    $('poolDesc').textContent = fmt('pool_d', { n: nf(total) });
    $('poolBar').style.width = (doneN / total * 100) + '%';
    var btn = $('poolBtn'); btn.disabled = poolState.running;
    btn.textContent = poolState.running ? fmt('pool_run', { d: nf(doneN), n: nf(total) }) : t(poolState.finished ? 'pool_again' : 'pool_btn');

    var list = $('poolList'); list.textContent = '';
    IP_POOL.forEach(function (it) {
      var r = res[it.ip];
      var row = el('div', 'ip-row'); row.appendChild(el('span', 'ipv', it.ip)); row.appendChild(el('span', 'lb', it.name));
      var st = el('span', 'st', '—');
      if (r && r.state === 'testing') st.textContent = t('st_test');
      else if (r && r.state === 'timeout') { st.className = 'st bad'; st.textContent = t('st_down'); }
      else if (r) {
        st.className = 'st ' + (r.ms > 1500 ? 'warn' : 'good'); st.textContent = t('st_up') + ' · ';
        var bd = document.createElement('bdi'); bd.textContent = nf(r.ms) + ' ms'; st.appendChild(bd);
      }
      row.appendChild(st); list.appendChild(row);
    });

    var sm = $('poolSummary'); sm.textContent = '';
    if (!poolState.finished) return;
    var vals = IP_POOL.map(function (i) { return res[i.ip]; });
    var good = vals.filter(function (r) { return r && r.state !== 'timeout'; });
    var full = vals.filter(function (r) { return r && r.state === 'ok'; }).length;
    var h = good.length, ratio = h / total;
    var cls = ratio >= 0.8 ? 'good' : ratio >= 0.5 ? 'warn' : 'bad';
    var v = el('div', 'verdict ' + cls);
    v.appendChild(el('b', null, fmt('pool_sum', { h: nf(h), n: nf(total) })));
    v.appendChild(el('div', null, t(ratio >= 0.8 ? 'pool_good' : ratio >= 0.5 ? 'pool_mid' : 'pool_bad')));
    v.appendChild(el('small', null, fmt('pool_break', { a: nf(full), b: nf(h - full), c: nf(total - h) })));
    if (h) v.appendChild(el('small', null, fmt('pool_lat', { ms: nf(Math.round(good.reduce(function (a, r) { return a + r.ms; }, 0) / h)) })));
    sm.appendChild(v);
  }

  async function testPool() {
    if (poolState.running) return;
    poolState = { running: true, finished: false, results: {} }; renderPool();
    var idx = 0;
    async function worker() {
      while (true) {
        var i = idx++; if (i >= IP_POOL.length) return;
        var ip = IP_POOL[i].ip;
        poolState.results[ip] = { state: 'testing' }; renderPool();
        var p = await probe(ip, PROBE_MS);
        if (p.state === 'timeout') p = await probe(ip, PROBE_MS);   /* یک بار دیگر برای اطمینان */
        poolState.results[ip] = p; renderPool();
      }
    }
    await Promise.all([1, 2, 3, 4, 5, 6].map(worker));
    poolState.running = false; poolState.finished = true; renderPool();
  }

  var PK_RE = /:([a-z0-9]{2,10}):/g, pk = { target: null };
  var CUSTOM_STK = {};                       /* استیکرهای اختصاصی ادمین‌ها: code -> {url,title,by,id} */
  function pkHas(k) { return Object.prototype.hasOwnProperty.call(PACK, k) || Object.prototype.hasOwnProperty.call(CUSTOM_STK, k); }
  function pkSrc(k) { return Object.prototype.hasOwnProperty.call(PACK, k) ? PACK[k] : (CUSTOM_STK[k] ? mediaUrl(CUSTOM_STK[k].url) : ''); }
  async function refreshStickers() {
    if (!db || !db.canStickers) return;
    try {
      var rows = await db.stickerList();
      var map = {};
      (rows || []).forEach(function (s) { map[s.code] = s; });
      CUSTOM_STK = map;
      buildPkGrid();
    } catch (e) {}
  }
  function pkFix(tn) {                       /* :کد: داخل متن ← عکس استیکر */
    var v = tn.nodeValue, par = tn.parentNode;
    if (!v || v.indexOf(':') < 0 || !par || /^(SCRIPT|STYLE|TEXTAREA|OPTION|TITLE)$/.test(par.nodeName)) return;
    var only = /^\s*:([a-z0-9]{2,10}):\s*$/.exec(v);
    var big = !!(only && pkHas(only[1]) && par.closest && par.closest('.bubble'));   /* پیام فقط یک استیکر ← بزرگ */
    var frag = document.createDocumentFragment(), last = 0, m, hit = false;
    PK_RE.lastIndex = 0;
    while ((m = PK_RE.exec(v))) {
      if (!pkHas(m[1])) { PK_RE.lastIndex = m.index + 1; continue; }
      hit = true;
      if (m.index > last) frag.appendChild(document.createTextNode(v.slice(last, m.index)));
      var im = document.createElement('img'); im.src = pkSrc(m[1]); im.alt = m[0]; im.draggable = false; im.className = big ? 'pk-big' : 'pk-in';
      frag.appendChild(im); last = m.index + m[0].length;
    }
    if (!hit) return;
    if (last < v.length) frag.appendChild(document.createTextNode(v.slice(last)));
    par.replaceChild(frag, tn);
  }
  function pkScan(n) {
    if (n.nodeType === 3) return pkFix(n);
    if (n.nodeType !== 1 || /^(SCRIPT|STYLE|TEXTAREA)$/.test(n.nodeName)) return;
    var w = document.createTreeWalker(n, NodeFilter.SHOW_TEXT), list = [], x;
    while ((x = w.nextNode())) if (x.nodeValue.indexOf(':') >= 0) list.push(x);

  }

  function buildPkGrid() {

  function pkClose() { $('pkPop').hidden = true; }
  function pkToggle(inp) {

  }
  function pkInsert(k) {
    var inp = pk.target; if (!inp) return; var code = ':' + k + ':';
    var v = inp.value, s = inp.selectionStart, e = inp.selectionEnd; if (s == null) { s = e = v.length; }
    if (inp.maxLength > 0 && v.length - (e - s) + code.length > inp.maxLength) { flash(t('pk_full')); return; }

  }
  [$('msgInput'), $('pubInput')].forEach(function (inp) { inp.parentNode.insertBefore(pkBtn(inp, 'icon-btn', '🎭'), inp); });
  [$('pfName'), $('pfBio')].forEach(function (inp) { inp.insertAdjacentElement('afterend', pkBtn(inp, 'pk-btn', t('pk_btn'), 'pk_btn')); });

  $('callBtn').title = t('call_btn');
  $('callBtn').addEventListener('click', callStart);
  $('cbAcc').addEventListener('click', callAccept);
  $('cbEnd').addEventListener('click', function () { if (room) roomLeave(); else callEnd(true); });
  $('cbMute').addEventListener('click', function () {
    var st = room ? room.stream : call && call.stream; if (!st) return; var on = false;
    st.getAudioTracks().forEach(function (x) { x.enabled = !x.enabled; on = !x.enabled; });
    $('cbMute').classList.toggle('off', on);
  });
  setInterval(async function () {
    if (!me) { if (call) callEnd(false); if (room) roomLeave(); if (!$('pubBox').hidden) pubClose(); if (!$('musicBox').hidden) muClose(); if (!$('gamesBox').hidden) gaClose(); if (!$('vxPlayer').hidden) { vxClosePlayer(); return; } if (!$('videoBox').hidden) { vxClose(); return; } return; }
    if (callPolling || !db || !db.canCall) return; callPolling = true;
    try { var r = await db.callPoll(); (r || []).forEach(callSignal); } catch (e) {}
    callPolling = false;
  }, 1200);

  /* ===== پنل مدیریت: تعیین رنک، بن/اخطار کاربران، ساخت استیکر اختصاصی (فقط ادمین/مالک) ===== */
  var adminTarget = null, adminStkFile = null;
  function setAdminMsg(txt, err) { var m = $('adminMsg'); m.textContent = txt || ''; m.className = 'msg' + (err ? ' err' : ''); }
  function setAdminStkMsg(txt, err) { var m = $('adminStkMsg'); m.textContent = txt || ''; m.className = 'msg' + (err ? ' err' : ''); }
  function renderAdminStickerList() {
    var box = $('adminStkList'); if (!box) return; box.textContent = '';
    Object.keys(CUSTOM_STK).forEach(function (code) {
      var s = CUSTOM_STK[code];
      var row = document.createElement('div'); row.className = 'row'; row.style.cssText = 'display:flex;align-items:center;gap:8px;padding:4px 0';
      var im = document.createElement('img'); im.src = mediaUrl(s.url); im.alt = ''; im.style.cssText = 'width:32px;height:32px;object-fit:contain;border-radius:6px';
      var sp = document.createElement('span'); sp.style.flex = '1'; sp.textContent = ':' + code + ': ' + (s.title || '');
      var del = document.createElement('button'); del.type = 'button'; del.className = 'ghost danger'; del.textContent = '✕';
      del.addEventListener('click', async function () {
        if (!confirm(t('admin_sticker_del_q'))) return;
        try { await db.stickerDel(s.id); await refreshStickers(); renderAdminStickerList(); } catch (e) {}
      });
      row.appendChild(im); row.appendChild(sp); row.appendChild(del);
      box.appendChild(row);
    });
  }
  function openAdmin() {
    toggleMenu(false);
    adminTarget = null;
    $('adminHandle').value = ''; $('adminUserBox').hidden = true; setAdminMsg(''); setAdminStkMsg('');
    $('adminStkCode').value = ''; $('adminStkTitle').value = ''; adminStkFile = null;
    $('adminStkPhotoBtn').textContent = t('photo_choose'); $('adminStkFile').value = '';
    $('adminRankBox').hidden = !me || me.rank !== 'owner';
    renderAdminStickerList();
    $('adminModal').hidden = false;
    $('adminHandle').focus({ preventScroll: true });
  }
  function closeAdmin() { $('adminModal').hidden = true; }
  $('adminBtn').addEventListener('click', openAdmin);
  $('adminClose').addEventListener('click', closeAdmin);
  $('adminModal').addEventListener('click', function (e) { if (e.target === $('adminModal')) closeAdmin(); });
  async function adminLoadUser() {
    var h = String($('adminHandle').value || '').trim().toLowerCase();
    if (!HANDLE_RE_CLIENT.test(h)) { setAdminMsg(t('err_handle'), true); return; }
    setAdminMsg(t('wait'));
    try {
      var d = await db.adminLookup(h);
      if (!d || d.error) { setAdminMsg(d && d.error === 'forbidden' ? t('admin_forbidden') : t('admin_not_found'), true); $('adminUserBox').hidden = true; return; }
      adminTarget = h;
      var rankLabel = d.rank === 'owner' ? t('rank_owner') : (d.rank === 'admin' ? t('rank_admin') : t('rank_user'));
      $('adminUserInfo').textContent = '@' + h + ' — ' + rankLabel + (d.banned ? ' — ⛔' : '') + ' — ' + (d.warnCount || 0);
      $('adminRank').value = (d.rank === 'admin') ? 'admin' : '';
      $('adminBanBtn').textContent = d.banned ? t('admin_unban') : t('admin_ban');
      $('adminBanBtn').dataset.banned = d.banned ? '1' : '';
      $('adminUserBox').hidden = false;
      setAdminMsg('');
    } catch (e) { setAdminMsg(t('admin_forbidden'), true); }
  }
  $('adminLoad').addEventListener('click', adminLoadUser);
  $('adminRankSave').addEventListener('click', async function () {
    if (!adminTarget) return;
    setAdminMsg(t('wait'));
    try {
      var r = await db.adminSetRank(adminTarget, $('adminRank').value);
      if (r && r.ok) { setAdminMsg(t('admin_saved')); adminLoadUser(); } else setAdminMsg(t('admin_forbidden'), true);
    } catch (e) { setAdminMsg(t('admin_forbidden'), true); }
  });
  $('adminBanBtn').addEventListener('click', async function () {
    if (!adminTarget) return;
    var willBan = !$('adminBanBtn').dataset.banned;
    setAdminMsg(t('wait'));
    try {
      var r = await db.adminBan(adminTarget, willBan, '');
      if (r && r.ok) { setAdminMsg(t('admin_saved')); adminLoadUser(); } else setAdminMsg(t('admin_forbidden'), true);
    } catch (e) { setAdminMsg(t('admin_forbidden'), true); }
  });
  $('adminWarnBtn').addEventListener('click', async function () {
    if (!adminTarget) return;
    var text = $('adminWarnText').value.trim(); if (!text) return;
    setAdminMsg(t('wait'));
    try {
      var r = await db.adminWarn(adminTarget, text);
      if (r && r.ok) { $('adminWarnText').value = ''; setAdminMsg(t('admin_saved')); adminLoadUser(); } else setAdminMsg(t('admin_forbidden'), true);
    } catch (e) { setAdminMsg(t('admin_forbidden'), true); }
  });
  $('adminStkPhotoBtn').addEventListener('click', function () { $('adminStkFile').click(); });
  $('adminStkFile').addEventListener('change', function () {
    adminStkFile = this.files && this.files[0] ? this.files[0] : null;
    $('adminStkPhotoBtn').textContent = adminStkFile ? adminStkFile.name.slice(0, 24) : t('photo_choose');
  });
  $('adminStkAdd').addEventListener('click', async function () {
    var code = String($('adminStkCode').value || '').toLowerCase().trim();
    var title = String($('adminStkTitle').value || '').trim();
    if (!adminStkFile) { setAdminStkMsg(t('admin_sticker_need_photo'), true); return; }
    if (!/^[a-z0-9]{2,10}$/.test(code)) { setAdminStkMsg(t('admin_sticker_bad_code'), true); return; }
    setAdminStkMsg(t('uploading'));
    try {
      var up = await db.upload('photo', adminStkFile, adminStkFile.name, adminStkFile.type || 'image/jpeg');
      var r = await db.stickerAdd(up.url, code, title);
      if (r && r.ok) {
        setAdminStkMsg(t('admin_sticker_added'));
        $('adminStkCode').value = ''; $('adminStkTitle').value = ''; adminStkFile = null;
        $('adminStkPhotoBtn').textContent = t('photo_choose'); $('adminStkFile').value = '';
        await refreshStickers(); renderAdminStickerList();
      } else if (r && r.reason === 'taken') setAdminStkMsg(t('admin_sticker_taken'), true);
      else setAdminStkMsg(t('admin_forbidden'), true);
    } catch (e) { setAdminStkMsg(t(e && e.code === 'too-large' ? 'err_photo_too_big' : 'upload_fail'), true); }
  });
})();
</script>
</body>
</html>
